<!--

    (progress read live from localStorage by js/df-summary.js + js/landing.js).
    All visible text lives in lang/messages/en/index.json.
-->
<body data-page="index" data-root="./">
    <nav>
        <div class="container">
            <div class="nav-content">
                <a href="./" class="logo" id="logo-name"></a>
                <div class="nav-right">
                    <ul class="nav-links">
                    <li class="has-menu">
                        <button class="nav-menu-btn" id="games-menu-btn" type="button" aria-haspopup="true" aria-expanded="false">Acts <span class="caret" aria-hidden="true">&#9662;</span></button>
                        <ul class="nav-menu" id="games-menu">
                        <li><a href="tools/act1.html">Act 1 — Tormund's Story</a></li>
                        <li><a href="tools/act2.html">Act 2 — Roberta's Story</a></li>
                        <li><a href="tools/act3.html">Act 3 — Heroes United</a></li>
                        <li><a href="tools/act4.html">Act 4 — Legends of Altador</a></li>
                        <li><a href="tools/achievements.html">Achievements</a></li>
                        <li><a href="tools/bestiary.html">Bestiary &amp; Elements</a></li>
                        </ul>
                    </li>
                    </ul>
                    <div class="theme-toggle">
                        <button id="themeToggle" class="theme-btn" type="button">
                            <span class="theme-icon" id="theme-icon" aria-hidden="true"></span>
                            <span class="theme-text" id="theme-text"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <section class="project-hero landing-hero">
            <figure class="banner landing-banner"><img class="banner-img" src="images/banners/series.jpg" alt=""></figure>
        </section>

        <main class="main-content">
            <section class="section">
                <h2 id="lg-total-label"></h2>
                <div id="series-total" class="series-total"></div>
            </section>

            <section class="section">
                <h2 id="lg-games-label"></h2>
                <div id="collections"></div>
            </section>
        </main>
    </div>

    <script src="js/i18n.js"></script>
    <script src="js/df-common.js"></script>
    <script src="js/act1-data.js"></script>
    <script src="js/act2-data.js"></script>
    <script src="js/act3-data.js"></script>
    <script src="js/act4-data.js"></script>
    <script src="js/achievements-data.js"></script>
    <script src="js/bestiary-data.js"></script>
    <script src="js/df-summary.js"></script>
    <script src="js/landing.js"></script>
    <script src="js/banners.js"></script>
    <script src="js/nav.js"></script>
